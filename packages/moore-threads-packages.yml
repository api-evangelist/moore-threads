name: Moore Threads Packages and SDKs
description: >-
  Moore Threads publishes exactly one first-party client SDK to a public package registry — the
  `mtai` browser SDK for its digital-human service on npm. Everything else the company distributes
  is a GPU compute artifact rather than an API client: 133 public repositories under the
  MooreThreads GitHub org (almost all MUSA ports of upstream CUDA projects), and three official
  Docker Hub images. None of the AIBook speech APIs (TTS, ASR, voice conversion) has a published
  client library in any registry, and the KUAE Cloud Coding Plan ships no SDK because it is
  consumed through the stock Anthropic and OpenAI clients.
