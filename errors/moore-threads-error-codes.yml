  note: >-
    Only one error is published, in the Claude Code troubleshooting section. The endpoint speaks
    the Anthropic and OpenAI error envelopes, so callers should expect those providers' shapes,
    but Moore Threads publishes no error reference of its own for this surface.
  envelope: '{"error": {"code": ..., "message": ..., "param": ..., "type": ...}}'
  codes:
  - {code: AuthenticationError, text: The API key format is incorrect. Request id:0217xxxxxxx, type: Unauthorized, class: auth, action: Run /logout in Claude Code and re-launch with ANTHROPIC_AUTH_TOKEN set}
gaps:
- No RFC 9457 application/problem+json on any surface.
- No documented HTTP status-code mapping — the docs say only "HTTP 200 means success, anything else means failure".
- The KUAE Cloud Coding Plan endpoint has no published error reference at all.
