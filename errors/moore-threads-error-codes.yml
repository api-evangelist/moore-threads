generated: '2026-08-26'
method: searched
source: https://docs.mthreads.com/asr/recording-recognition/introduction
name: Moore Threads AIBook Error / Status Code Registry
description: >-
  The AIBook speech APIs share one numeric status vocabulary carried in a `status` integer plus a
  `status_text` string, returned in the JSON body of both HTTP responses and WebSocket control
  frames. 1xxx is success/in-progress, 2xxx is caller identity and quota, 3xxx is server-side, 4xxx
  is request/payload validation. It is NOT RFC 9457 problem+json; HTTP status is a coarse
  200/400/500 and the real outcome is the numeric code in the body.
format: vendor-numeric
problem_json: false
rfc9457: false
envelope:
  fields:
  - name: task_id
    type: string
    note: Server-generated session/job id. Spelled `taskid` in one documented response sample — an inconsistency in the published docs.
  - name: status
    type: integer
    note: The authoritative outcome code.
  - name: status_text
    type: string
  - name: type
    type: string
    note: WebSocket surfaces only — TranscriptionStarted / SentenceBegin / SentenceChanged / SentenceEnd / TranscriptionCompleted / ConversionStarted / ConversionCompleted / Warning / Error.
catalogs:
- id: asr
  applies_to:
  - Moore Threads AIBook Speech Recognition API
  - Moore Threads AIBook Streaming Voice Conversion API
  source: https://docs.mthreads.com/asr/recording-recognition/introduction
  codes:
  - {code: 1000, text: success!, meaning: Success, class: success}
  - {code: 1001, text: waiting, meaning: Queued, class: in-progress}
  - {code: 1002, text: running, meaning: Recognition in progress, class: in-progress}
  - {code: 2001, text: appid doesn't exist!, meaning: Unknown appid, class: auth, action: Check the appid issued to you}
  - {code: 2002, text: authorization failed., meaning: Authentication failed, class: auth, action: Check the access token}
  - {code: 2003, text: too many requests, meaning: Concurrency limit exceeded, class: quota, action: Back off and retry}
  - {code: 2004, text: service overload, meaning: Client sending data faster than realtime, class: quota, action: Pace audio frames to wall-clock}
  - {code: 3001, text: service is busy, meaning: Server busy, class: server, action: Retry}
  - {code: 3002, text: service timeout, meaning: Server processing timeout, class: server, action: Retry}
  - {code: 3003, text: client is disconnected, meaning: Client disconnected before completion, class: server}
  - {code: 3004, text: errors occured during processing, meaning: Recognition failure, class: server}
  - {code: 3005, text: cannot find the taskid, meaning: Task expired or unknown task_id, class: server, action: Results are retained 72 hours only}
  - {code: 3006, text: invalid audio type, meaning: audio_type not permitted, class: server}
  - {code: 3007, text: language is not supported, meaning: Unsupported source language, class: server}
  - {code: 3008, text: target language is not supported, meaning: Unsupported translation target, class: server}
  - {code: 3009, text: errors occured during translation, meaning: Translation failure, class: server}
  - {code: 4001, text: unknown parameter is given., meaning: Unknown/unsupported parameter, class: request}
  - {code: 4002, text: given value is invalid, meaning: Illegal parameter value, class: request}
  - {code: 4003, text: request invalid, meaning: Malformed request message, class: request}
