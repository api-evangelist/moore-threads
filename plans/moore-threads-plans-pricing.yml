name: Moore Threads Plans and Pricing
description: >-
  Moore Threads publishes named subscription tiers for exactly one API — the KUAE Cloud Coding Plan
  — and publishes the ENTITLEMENTS of each tier without publishing the PRICE of any of them. There
  is no pricing page on mthreads.com, docs.mthreads.com or kuaecloud.net; paid tiers are sold as a
  physical SKU on a JD.com storefront and redeemed with a code, so the price lives on a
  third-party marketplace listing rather than on the provider's own surface. The AIBook speech APIs
  (TTS, ASR, voice conversion) publish no plans, no prices and no self-service signup at all —
  access is by emailing named staff.
plan_count: 4
