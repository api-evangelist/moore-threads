aid: moore-threads
name: Moore Threads
description: >-
  Moore Threads (摩尔线程智能科技) is a Chinese GPU company founded in June 2020 that builds
  full-function GPUs and the MUSA (Meta-computing Unified System Architecture) software stack —
  a CUDA-alternative programming environment covering the MUSA SDK, muDNN, muBLAS, MCCL,
  Triton-MUSA and the Musify CUDA-porting toolkit. Alongside the silicon and the SDK it operates
  a small but real public API surface: the AIBook speech platform (HTTP and WebSocket text-to-speech,
  streaming and recording-file speech recognition, and streaming voice conversion on
  aibook-api.mthreads.com), the KUAE Cloud (夸娥云) Coding Plan — an OpenAI- and Anthropic-compatible
  LLM inference endpoint at coding-plan-endpoint.kuaecloud.net serving GLM-4.7 on MTT S5000 GPUs —
  and the "摩影元像" digital-human Web SDK distributed on npm as `mtai`. None of these surfaces
  publishes a machine-readable contract; every operation is documented as prose, parameter tables
  and curl/Python samples on docs.mthreads.com, and access tokens are issued by contacting sales.
