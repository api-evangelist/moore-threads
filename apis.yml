apis:
- name: Moore Threads AIBook Text-to-Speech API
  description: >-
    HTTP and WebSocket speech synthesis. A non-streaming POST /api/v1/tts/generate returns a
    complete wav/mp3 for up to 300 characters; a WebSocket /api/v2/tts/stream_generate streams
    base64 PCM chunks with word- and phoneme-level timestamps, and additionally accepts streaming
    TEXT input so an LLM's token stream can be voiced as it is produced. 27 named voices are
    published, split between large-model and lite voices. Authenticated with an Authorization
    header; tokens are issued by contacting Moore Threads.
  humanURL: https://docs.mthreads.com/tts/unary-tts/introduction
  baseURL: https://aibook-api.mthreads.com:32414
  tags:
  - Text To Speech
  - Voice
  - Streaming
  properties:
  - type: Documentation
    url: https://docs.mthreads.com/tts/unary-tts/introduction
  - type: APIReference
    url: https://docs.mthreads.com/tts/stream-tts/introduction
- name: Moore Threads AIBook Speech Recognition API
  description: >-
    Speech-to-text in two shapes. A realtime WebSocket at /api/v1/asr accepts 16 kHz mono audio
    and returns SentenceBegin / SentenceChanged / SentenceEnd events with optional punctuation,
    ITN, disfluency removal, speaker diarization, confidence and word-level timing. A recording-file
    HTTP API on the same base submits a job by URL or chunked upload, then polls for the transcript
    or receives it on a callback URL; audio up to 512 MB / 5 hours, results retained 72 hours.
    Bearer token authentication.
  humanURL: https://docs.mthreads.com/asr/recording-recognition/introduction
  baseURL: https://aibook-api.mthreads.com:62220/api/v1/asr
  tags:
  - Speech Recognition
  - Voice
  - Transcription
  properties:
  - type: Documentation
    url: https://docs.mthreads.com/asr/recording-recognition/introduction
  - type: APIReference
    url: https://docs.mthreads.com/asr/realtime-recognition/introduction
- name: Moore Threads AIBook Streaming Voice Conversion API
  description: >-
    A WebSocket voice-conversion service at /api/v1/streaming_vc that re-timbres a live 16 kHz
    16-bit mono PCM stream into a target voice and returns 48 kHz PCM. Interaction is
    StartConversion → binary audio frames → StopConversion, with ConversionStarted /
    ConversionCompleted / Error control messages. Token passed as a URL query parameter.
  humanURL: https://docs.mthreads.com/vc/stream-vc/introduction
  baseURL: https://aibook-api.mthreads.com:32314
  tags:
  - Voice
  - Streaming
  - Audio
  properties:
  - type: Documentation
    url: https://docs.mthreads.com/vc/stream-vc/introduction
- name: KUAE Cloud Coding Plan API
  description: >-
    An LLM inference endpoint operated on Moore Threads MTT S5000 GPUs and sold as a subscription
    for AI coding tools. It speaks two wire protocols from one host — the Anthropic Messages
    protocol at the root (used by Claude Code) and the OpenAI Chat Completions protocol at /v1
    (used by Cline, Cursor, Roo Code, Kilo Code and OpenCode) — serving the GLM-4.7 model.
    Authenticated with an API key created in the KUAE Cloud console.
  humanURL: https://docs.mthreads.com/kuaecloud/kuaecloud-doc-online/coding_plan/tools_config
  baseURL: https://coding-plan-endpoint.kuaecloud.net
  tags:
  - LLM Inference
  - Artificial Intelligence
  - Developer Tools
  properties:
